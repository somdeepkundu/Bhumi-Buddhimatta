<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crop Kc Finder</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+Devanagari:wght@400;500;700&family=Noto+Sans+Bengali:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ea;--card:#fff;--ink:#17261c;--mute:#5d6b60;--line:#d3ddd0;--green:#23573a;--leaf:#4f8f5c;--sun:#e2a82b;--warn:#b5651d;--blue:#2f6f9e;--red:#c0503f;--purple:#7a5ea8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1712;--card:#18231c;--ink:#e4ece5;--mute:#98a89c;--line:#2c3b31;--green:#7cc394;--leaf:#5fae74;--sun:#f0bd4b;--warn:#e39a5a;--blue:#74b2dd;--red:#e0796a;--purple:#b49ada}}
:root[data-theme="dark"]{--bg:#0f1712;--card:#18231c;--ink:#e4ece5;--mute:#98a89c;--line:#2c3b31;--green:#7cc394;--leaf:#5fae74;--sun:#f0bd4b;--warn:#e39a5a;--blue:#74b2dd;--red:#e0796a;--purple:#b49ada}
:root[data-theme="light"]{--bg:#eef2ea;--card:#fff;--ink:#17261c;--mute:#5d6b60;--line:#d3ddd0;--green:#23573a;--leaf:#4f8f5c;--sun:#e2a82b;--warn:#b5651d;--blue:#2f6f9e;--red:#c0503f;--purple:#7a5ea8}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;
 font-family:"IBM Plex Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Tamil",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px}
.bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:flex-end;margin-bottom:8px}
.bar .grp{display:flex;flex-direction:column}
h1{font-size:1.55rem;margin:2px 0;color:var(--green);letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 14px;font-size:.93rem}
nav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
nav button,.seg button{font:inherit;cursor:pointer}
nav button{font-size:.92rem;padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mute)}
nav button.on{background:var(--green);border-color:var(--green);color:var(--bg);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{font-size:.8rem;padding:6px 10px;border:0;background:transparent;color:var(--mute)}
.seg button.on{background:var(--green);color:var(--bg);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{font-size:.83rem;color:var(--mute);display:block;margin-bottom:4px}
select,input,textarea{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.bar select{font-size:.85rem;padding:6px 10px;width:auto}
textarea{font-family:"IBM Plex Mono",monospace;font-size:.85rem;min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:560px){.row,.row3{grid-template-columns:1fr}}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.note{font-size:.84rem;color:var(--mute);margin:8px 0 0}
.peak{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.peak b{display:block;font-size:1.45rem;color:var(--green);font-family:"IBM Plex Mono",monospace}
.peak span{font-size:.79rem;color:var(--mute)}
svg{width:100%;height:auto;display:block}
.tw{overflow-x:auto;max-height:430px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mute);font-weight:500}
th:first-child,td:first-child{text-align:left}
td{font-family:"IBM Plex Mono",monospace;cursor:pointer}
tr.sel td{background:color-mix(in srgb,var(--sun) 25%,transparent)}
.flag{color:var(--warn)!important}
.eq{font-family:"IBM Plex Mono",monospace;font-size:.86rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;overflow-x:auto}
.eq div{white-space:nowrap}
.hide{display:none}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin-top:6px}
.lg i{display:inline-block;width:20px;height:3px;vertical-align:middle;margin-right:5px}
button.small{font:inherit;font-size:.84rem;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;margin-top:10px;margin-right:8px}
footer{font-size:.77rem;color:var(--mute);margin-top:18px}

const DAYS=[40];for(let a=50;a<=360;a+=10)DAYS.push(a);
function xval(d,k,useR){const n=(d.v?Math.max(...d.v.map(c=>c.length)):d.len)||1;

 if(useR)return d.start===0?k/Math.max(1,(d.len||n)-1):(k+1)/(d.len||n);
 return d.start+k}
function niceStep(raw){const e=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/e;
 return (f<=1?1:f<=1.5?1.5:f<=2?2:f<=2.5?2.5:f<=3?3:f<=4?4:f<=5?5:10)*e}
function axis(lo,hi,want){if(!(hi>lo))hi=lo+1;
 const step=niceStep((hi-lo)/Math.max(2,want));
 return {lo:Math.floor(lo/step)*step,hi:Math.ceil(hi/step)*step,step:step}}

/* ---------- polynomial helpers ---------- */
function polyfit(X,Y,deg){const n=deg+1,A=[],b=[];
 for(let i=0;i<n;i++){const row=[];for(let j=0;j<n;j++)row.push(X.reduce((s,x)=>s+Math.pow(x,i+j),0));A.push(row);b.push(X.reduce((s,x,k)=>s+Math.pow(x,i)*Y[k],0))}
 for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;
  [A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];if(Math.abs(A[i][i])<1e-12)return null;
  for(let r=0;r<n;r++){if(r===i)continue;const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}
 return b.map((v,i)=>v/A[i][i]).reverse()}
const evalp=(c,x)=>c.reduce((s,k)=>s*x+k,0);
function eqStr(c){const d=c.length-1;return "Kc = "+c.map((v,i)=>{const p=d-i,a=(i?(v<0?" − ":" + "):(v<0?"−":""))+Math.abs(v).toPrecision(5);
 return a+(p>1?"·x^"+p:p===1?"·x":"")}).join("")}

 const n=Math.max(...d.v.map(c=>c.length)),prev=+wk.value;wk.innerHTML="";
 for(let i=0;i<n;i++)wk.add(new Option(lab(d,i),i));wk.value=prev<n?prev:0;draw()}
function draw(){const d=cur(),m=+method.value||0,col=d.v[m],fl=d.f[m];
 const mx=Math.max(...col.filter(v=>v!=null)),pi=col.indexOf(mx);
 $("info").innerHTML=`<div class="meta"><span class="chip">${nm("uni",d.uni)}</span><span class="chip">${col.length} ${d.unit==="period"?t("periodsN"):t("weeksN")}</span><span class="chip">${t("peakKc")} ${mx.toFixed(2)} · ${lab(d,pi)}</span></div>`+
  (noteText(d)?`<p class="note">${noteText(d)}</p>`:"");
 if(+wk.value>=col.length)wk.value=0;
 const i=+wk.value,kc=col[i],e=parseFloat(eto.value)||0;
 $("calc").innerHTML=kc==null?`<div><span>${t("unreadable")}</span></div>`:
 `<div><span>${t("kc")}</span><b class="${fl[i]?"flag":""}">${kc.toFixed(2)}</b></div><div><span>${t("etcmm")}</span><b>${(kc*e).toFixed(2)}</b></div><div><span>${t("lha")}</span><b>${Math.round(kc*e*10000).toLocaleString()}</b></div><div><span>${t("lacre")}</span><b>${Math.round(kc*e*4047).toLocaleString()}</b></div>`;
 const W=800,H=280,L=46,R=14,T=14,B=34,n=col.length;
 const mn=Math.min(...col.filter(v=>v!=null)),A=axis(Math.max(0,mn-0.05),mx+0.05,6);
 const x=k=>L+(n<2?0:k*(W-L-R)/(n-1)),y=v=>T+(1-(v-A.lo)/(A.hi-A.lo))*(H-T-B);
 let s="";for(let g=A.lo;g<=A.hi+1e-9;g+=A.step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L-8}" y="${y(g)+4}" text-anchor="end" font-size="12" fill="var(--mute)">${fmtN(g,A.step)}</text>`;
 let p="",seg=false;col.forEach((v,k)=>{if(v==null){seg=false;return}p+=(seg?"L":"M")+x(k)+" "+y(v);seg=true});
 s+=`<path d="${p}" fill="none" stroke="var(--leaf)" stroke-width="3" stroke-linejoin="round"/>`;
 col.forEach((v,k)=>{if(v!=null)s+=`<circle cx="${x(k)}" cy="${y(v)}" r="${k===i?8:4}" fill="${k===i?"var(--sun)":fl[k]?"var(--warn)":"var(--green)"}" data-k="${k}" style="cursor:pointer"/>`;
  const q=d.unit==="period"?(k%4===0?bins[k].split("–")[0]:""):(n<=26||k%2===0?d.start+k:"");
  if(q!=="")s+=`<text x="${x(k)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--mute)">${q}</text>`});
 $("chart").innerHTML=s;$("chart").querySelectorAll("circle").forEach(c=>c.onclick=()=>{wk.value=c.dataset.k;draw()});
 let tb=`<tr><th>${d.unit==="period"?t("days"):t("week")}</th>${d.cols.map(c=>`<th>${nm("cols",c)}</th>`).join("")}<th>${t("etcmm")}</th></tr>`;
 const N=Math.max(...d.v.map(c=>c.length));
 for(let k=0;k<N;k++){tb+=`<tr class="${k===i?"sel":""}" data-k="${k}"><td>${lab(d,k)}</td>`+d.v.map((c,ci)=>{const v=c[k];
  return `<td class="${v!=null&&d.f[ci][k]?"flag":""}">${v==null?(k<c.length?"—":""):v.toFixed(2)}</td>`}).join("")+`<td>${col[k]==null?"":(col[k]*e).toFixed(2)}</td></tr>`}
 $("tbl").innerHTML=tb;$("tbl").querySelectorAll("tr[data-k]").forEach(r=>r.onclick=()=>{wk.value=r.dataset.k;draw()});
 save()}
/* ---------- page 2 ---------- */
const fsrc=$("fsrc"),fmethod=$("fmethod"),fx=$("fx"),fdeg=$("fdeg"),fcoef=$("fcoef"),fvals=$("fvals"),fpts=$("fpts");
const PAL=["var(--blue)","var(--leaf)","var(--red)","var(--purple)"];
function ffill(){const cst=fsrc.value==="custom";$("fcustom").classList.toggle("hide",!cst);fmethod.innerHTML="";
 if(!cst){const d=D[+fsrc.value];d.cols.forEach((c,i)=>fmethod.add(new Option(nm("cols",c),i)));
  if(d.cols.length>1){fmethod.add(new Option(t("allSeries"),"all"));fmethod.value="all"}}
 $("fmwrap").style.visibility=(!cst&&D[+fsrc.value].cols.length>1)?"visible":"hidden";fdraw()}
function fdraw(){const src=fsrc.value,deg=+fdeg.value,useR=fx.value==="r";let S=[],head="",sub="",eqKey=null,d0=null;
 if(src==="custom"){const v=fvals.value.split(/[\s,;]+/).filter(Boolean).map(Number).filter(n=>!isNaN(n));
  S=[{name:t("custom"),v:v,f:v.map(()=>false),start:1,unit:"week"}];head=t("custom")}
 else{const d=D[+src];d0=d;const sel=fmethod.value,idx=(sel==="all"&&d.cols.length>1)?d.v.map((_,i)=>i):[+sel||0];
  S=idx.map(i=>({name:nm("cols",d.cols[i]),v:d.v[i],f:d.f[i],start:d.start,unit:d.unit,key:d.cols[i]}));
  head=title(d);sub=nm("uni",d.uni);if(idx.length===1)eqKey=d.cols[idx[0]]}
 const single=S.length===1;$("fcoefwrap").classList.toggle("hide",!single);
 const hasEq=single&&d0&&eqKey&&d0.eqs[eqKey];
 $("floadeq").classList.toggle("hide",!hasEq);
 if(hasEq)$("floadeq").onclick=()=>{fcoef.value=d0.eqs[eqKey].join(", ");fdraw()};
 S.forEach((s,i)=>{s.color=PAL[i%PAL.length];s.pts=[];
  s.len=s.v.length;s.v.forEach((v,k)=>{if(v!=null)s.pts.push({x:xval(s,k,useR),y:v,f:s.f[k]})});
  s.c=s.pts.length>=deg+1?polyfit(s.pts.map(p=>p.x),s.pts.map(p=>p.y),deg):null;
  if(s.c){const mean=s.pts.reduce((a,p)=>a+p.y,0)/s.pts.length;let ssr=0,sst=0;
   s.pts.forEach(p=>{const e=p.y-evalp(s.c,p.x);ssr+=e*e;sst+=(p.y-mean)**2});
   s.r2=1-ssr/sst;s.rmse=Math.sqrt(ssr/s.pts.length)}});
 let cc=null;if(single){const raw=fcoef.value.split(/[\s,;]+/).filter(Boolean).map(Number);if(raw.length>1&&raw.every(v=>!isNaN(v)))cc=raw}
 if(!S.some(s=>s.c)){$("fstat").innerHTML=`<div><span>${t("notEnough")}</span></div>`;$("fchart").innerHTML="";$("ftbl").innerHTML="";$("feq").textContent="";$("feq2").classList.add("hide");return}
 $("fstat").innerHTML=S.filter(s=>s.c).map(s=>{let mx=-9;const a=s.pts[0].x,b=s.pts[s.pts.length-1].x;
  for(let i=0;i<=200;i++)mx=Math.max(mx,evalp(s.c,a+(b-a)*i/200));
  return `<div><span style="color:${s.color}">${s.name}</span><b style="color:${s.color};font-size:1.05rem">R² ${s.r2.toFixed(4)}</b><span>RMSE ${s.rmse.toFixed(3)} · ${t("peakFit")} ${mx.toFixed(2)}</span></div>`}).join("");
 $("feq").innerHTML=S.filter(s=>s.c).map(s=>`<div${single?"":` style="color:${s.color}"`}>${single?"":s.name+": "}${eqStr(s.c)}</div>`).join("")+
  `<div style="color:var(--mute)">x = ${useR?t("xratio"):t("xweek")} · ${deg}° ${t("fitOf")}</div>`;
 $("feq2").classList.toggle("hide",!cc);
 if(cc)$("feq2").innerHTML=`<div>${t("printedEq")}: ${eqStr(cc)}</div><div style="color:var(--mute);white-space:normal">${t("eqNote")}</div>`;
 const W=800,H=340,L=56,R=16,T=22,B=52;
 const allx=[].concat(...S.map(s=>s.pts.map(p=>p.x))),x0=Math.min(...allx),x1=Math.max(...allx);
 const curves=S.map(s=>{if(!s.c)return null;const a=[],p0=s.pts[0].x,p1=s.pts[s.pts.length-1].x;
  for(let i=0;i<=240;i++){const x=p0+(p1-p0)*i/240;a.push([x,evalp(s.c,x)])}return a});
 let cur2=null;if(cc){cur2=[];for(let i=0;i<=240;i++){const x=x0+(x1-x0)*i/240;cur2.push([x,evalp(cc,x)])}}
 const dv=[].concat(...S.map(s=>s.pts.map(p=>p.y)));
 const dlo=Math.min(...dv),dhi=Math.max(...dv),pad=Math.max(0.05,(dhi-dlo)*0.25);
 let vals=[].concat(dv,...curves.filter(Boolean).map(a=>a.map(p=>p[1])));
 if(cur2)vals=vals.concat(cur2.map(p=>p[1]));
 const AY=axis(Math.max(dlo-pad,Math.min(...vals))-0.03,Math.min(dhi+pad,Math.max(...vals))+0.03,6),ylo=AY.lo,yhi=AY.hi;
 const AX=axis(x0,x1,useR?5:6);
 const X=v=>L+(v-x0)/((x1-x0)||1)*(W-L-R),Y=v=>T+(1-(v-ylo)/((yhi-ylo)||1))*(H-T-B);
 let s=`<text x="${(L+W-R)/2}" y="14" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink)">${head}${sub?" · "+sub:""}</text>`;
 for(let g=ylo;g<=yhi+1e-9;g+=AY.step)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-8}" y="${Y(g)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${fmtN(g,AY.step)}</text>`;
 for(let g=AX.lo;g<=x1+1e-9;g+=AX.step){if(g<x0-1e-9)continue;
  s+=`<line x1="${X(g)}" x2="${X(g)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${X(g)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--mute)">${fmtN(g,AX.step)}</text>`}
 const clamp=v=>Math.max(ylo,Math.min(yhi,v));
 const path=a=>a.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(clamp(p[1])).toFixed(1)).join("");
 if(cur2)s+=`<path d="${path(cur2)}" fill="none" stroke="var(--warn)" stroke-width="2.4" stroke-dasharray="7 5"/>`;
 S.forEach((se,i)=>{if(curves[i])s+=`<path d="${path(curves[i])}" fill="none" stroke="${se.color}" stroke-width="2.6"/>`});
 if(fpts.value==="1")S.forEach(se=>se.pts.forEach(p=>{s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.2" fill="${se.color}" fill-opacity="${p.f?.45:.9}" stroke="var(--ink)" stroke-width=".7"><title>${se.name} · ${useR?"t/T "+p.x.toFixed(3):fmtT(p.x)+(d0&&d0.unit==="period"?" d":"")} → Kc ${p.y.toFixed(2)}</title></circle>`}));
 const xttl=useR?t("xratioAx"):(d0&&d0.unit==="period"?t("periodLabel"):t("weekLabel"));
 s+=`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--mute)">${xttl}</text>`;
 s+=`<text transform="translate(14,${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="var(--mute)">${t("kc")}</text>`;
 $("fchart").innerHTML=s;
 $("flg").innerHTML=S.map(se=>`<span><i style="background:${se.color}"></i>${se.name}</span>`).join("")+(cc?`<span><i style="background:var(--warn)"></i>${t("printedEq")}</span>`:"")+`<span>${t("tableVals")} · ${deg}° ${t("fitOf")}</span>`;
 const N=Math.max(...S.map(se=>se.v.length));
 let th=`<tr><th>${useR?"t/T":(d0&&d0.unit==="period"?t("days"):t("week"))}</th>`+S.map(se=>`<th>${se.name}</th><th>${t("fitCol")}</th>`).join("")+(cc?`<th>${t("printedEq")}</th>`:"")+"</tr>",rows="";
 let csv=(useR?"t_over_T":(d0&&d0.unit==="period"?"days":"week"))+","+S.map(se=>"kc,fit").join(",")+(cc?",printed":"")+"\n";
 for(let k=0;k<N;k++){const xv=xval(S[0],k,useR);
  const cells=S.map(se=>{const v=se.v[k],f=(se.c&&v!=null)?evalp(se.c,xval(se,k,useR)):null;return {v:v,f:f,fl:se.f[k],len:se.v.length}});
  rows+=`<tr><td>${useR?xv.toFixed(3):fmtT(xv)}</td>`+cells.map(c=>`<td class="${c.v!=null&&c.fl?"flag":""}">${c.v==null?(k<c.len?"—":""):c.v.toFixed(2)}</td><td>${c.f==null?"":c.f.toFixed(3)}</td>`).join("")+(cc?`<td>${evalp(cc,xv).toFixed(3)}</td>`:"")+"</tr>";
  csv+=(useR?xv.toFixed(4):fmtT(xv))+","+cells.map(c=>(c.v==null?"":c.v.toFixed(2))+","+(c.f==null?"":c.f.toFixed(4))).join(",")+(cc?","+evalp(cc,xv).toFixed(4):"")+"\n"}
 $("ftbl").innerHTML=th+rows;$("fcsvbox").value=csv;save()}
/* ---------- chrome: language, theme, tabs ---------- */
function applyLang(){document.documentElement.lang=LG;
 [["l_title","appTitle"],["l_sub","appSub"],["l_crop","crop"],["l_eto","etoLabel"],["l_etcnote","etcNote"],["l_tap","tapNote"],
  ["l_data","dataLabel"],["l_series","seriesPlot"],["l_customv","customLabel"],["l_x","xtime"],["l_deg","degree"],
  ["l_pts","pointsShown"],["l_cmp","compareEq"],["l_src","source"],["l_made","madeBy"],["l_ndwi","ndwi"],
  ["l_theme","theme"],["l_language","language"]].forEach(([id,k])=>$(id).textContent=t(k));
 $("t1").textContent=t("tabCalc");$("t2").textContent=t("tabFit");
 $("fx").options[0].textContent=t("xratio");$("fx").options[1].textContent=t("xactual");
 $("fpts").options[0].textContent=t("ptsBoth");$("fpts").options[1].textContent=t("ptsCurve");
 $("floadeq").textContent=t("loadPrinted");
 $("fcsv").textContent=$("fcsvbox").classList.contains("hide")?t("showCsv"):t("hideCsv");
 $("theme").querySelectorAll("button").forEach(b=>b.textContent=t(b.dataset.t));
 const c=crop.value,f=fsrc.value,fm=fmethod.value;
 cropOptions(crop);cropOptions(fsrc,true);
 if(c!==""){crop.value=c}if(f!==""){fsrc.value=f}
 fill();ffill();if(fm&&[...fmethod.options].some(o=>o.value===fm))fmethod.value=fm;fdraw()}
const lang=$("lang");I.langs.forEach(l=>lang.add(new Option(LANGNAMES[l],l)));
lang.onchange=()=>{LG=lang.value;applyLang();save()};
function setTheme(v){document.documentElement.setAttribute("data-theme",v==="auto"?"":v);
 if(v==="auto")document.documentElement.removeAttribute("data-theme");
 $("theme").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===v));save()}
$("theme").querySelectorAll("button").forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
function tab(n){$("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2);
 $("p1").classList.toggle("hide",n!==1);$("p2").classList.toggle("hide",n!==2);if(n===2)fdraw()}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
crop.onchange=fill;method.onchange=draw;wk.onchange=draw;eto.oninput=draw;
fsrc.onchange=ffill;fmethod.onchange=fdraw;fx.onchange=fdraw;fdeg.onchange=fdraw;fpts.onchange=fdraw;fcoef.oninput=fdraw;fvals.oninput=fdraw;
$("fcsv").onclick=()=>{const b=$("fcsvbox");b.classList.toggle("hide");$("fcsv").textContent=b.classList.contains("hide")?t("showCsv"):t("hideCsv");if(!b.classList.contains("hide"))b.select()};
function save(){try{localStorage.setItem("kc-state",JSON.stringify({lg:LG,th:document.documentElement.getAttribute("data-theme")||"auto",c:crop.value,e:eto.value,f:fsrc.value}))}catch(_){}}
let st=null;try{st=JSON.parse(localStorage.getItem("kc-state")||"null")}catch(_){}
if(st&&st.lg&&I.langs.includes(st.lg))LG=st.lg;
lang.value=LG;cropOptions(crop);cropOptions(fsrc,true);
if(st){if(D[st.c])crop.value=st.c;if(st.e)eto.value=st.e;if(st.f!==undefined&&(st.f==="custom"||D[st.f]))fsrc.value=st.f}
setTheme(st&&st.th?st.th:"auto");applyLang();
</script></body></html>
